<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bathala — Legal</title>
<style>
  :root { --ink:#1a1a1f; --muted:#5a5a66; --rule:#e2e2e8; --bg:#fff; --link:#2d4acc; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink:#e8e8ee; --muted:#a0a0ad; --rule:#2e2e38; --bg:#141418; --link:#8fa6ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width:42rem; margin:0 auto; padding:3rem 16px 5rem; }
  h1 { font-size:1.9rem; margin:0 0 .4rem; letter-spacing:-.02em; }
  p.sub { color:var(--muted); margin:0 0 2.2rem; }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:1rem 0; border-top:1px solid var(--rule); }
  a { color:var(--link); text-decoration:none; font-weight:600; }
  a:hover { text-decoration:underline; }
  .note { color:var(--muted); font-size:.92rem; margin-top:.2rem; }
</style>
</head>
<body>
<main>
  <h1>Bathala</h1>
  <p class="sub">Legal documents for our apps.</p>
  <ul>
    <li>
      <a href="merge-depot/privacy/">Merge Depot — Privacy Policy</a>
      <div class="note">Android</div>
    </li>
  </ul>
</main>
</body>
</html>
